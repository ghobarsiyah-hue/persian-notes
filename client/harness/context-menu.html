<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Context menu test</title></head>
<body style="background: repeating-linear-gradient(45deg,#72a4ce 0 40px,#b794c9 40px 80px)">
<div id="root"></div><pre id="out">RUNNING</pre>
<script type="module">
import '/src/index.css';
import React from 'react';
import { createRoot } from 'react-dom/client';
import { ContextMenu } from '/src/editor/ribbon/contextual/contextMenu.tsx';
const root = createRoot(document.getElementById('root'));
root.render(React.createElement(ContextMenu, {
  x: 350, y: 200,
  items: [{ key: 'copy', label: 'کپی', onClick() {} }],
  toolbar: React.createElement('span', null, 'قالب‌بندی'),
  onClose() {}
}));
setTimeout(() => {
  const results = [];
  for (const dark of [false, true]) {
    document.documentElement.classList.toggle('dark', dark);
    const menu = document.querySelector('.pn-ctxmenu');
    const toolbar = document.querySelector('.pn-ctxmenu-toolbar');
    const style = getComputedStyle(menu);
    const alpha = Number(style.backgroundColor.match(/[\d.]+/g)?.[3] ?? 1);
    results.push(`${alpha > 0 && alpha < 0.5 && style.backdropFilter.includes('blur(20px)') ? 'PASS' : 'FAIL'} ${dark ? 'dark' : 'light'} vertical glass: ${style.backgroundColor}, ${style.backdropFilter}`);
    results.push(`${menu.parentElement === document.body ? 'PASS' : 'FAIL'} menu portal has no intermediate backdrop layer`);
    results.push(`${getComputedStyle(toolbar).backdropFilter.includes('blur(44px)') ? 'PASS' : 'FAIL'} horizontal toolbar unchanged`);
  }
  document.getElementById('out').textContent = results.join('\n');
}, 600);
</script>
</body>
</html>
